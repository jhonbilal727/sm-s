<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>Tic Tac Toe</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-container">


    <!-- Title -->
    <header class="title">

        <h1>Tic Tac Toe</h1>
        <p>Modern Edition</p>

    </header>


<!-- START MENU -->

<section class="start-menu" id="startMenu">

    <h1>Tic Tac Toe</h1>

    <p>Modern Edition</p>


    <button id="playBtn">
        Play Game
    </button>


    <button id="resetMenuBtn">
        Reset Scores
    </button>

</section>


    <main class="game-area" id="gameArea">


        <!-- LEFT : GAME BOARD -->

        <section class="board" id="board">

            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>

            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>

            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>

        </section>




        <!-- RIGHT : INFORMATION PANEL -->

        <section class="info-panel">


            <!-- Score -->

            <div class="score-panel">

                <div class="score-box x-box">

                    <span>Player X</span>
                    <strong id="xScore">0</strong>

                </div>


                <div class="score-box draw-box">

                    <span>Draws</span>
                    <strong id="drawScore">0</strong>

                </div>


                <div class="score-box o-box">

                    <span>Player O</span>
                    <strong id="oScore">0</strong>

                </div>


            </div>





            <!-- Current Turn -->

            <div class="turn-panel">

                <p>Current Turn</p>

                <div id="turnIndicator" class="turn-indicator">
                    X
                </div>

            </div>





            <!-- Game Message -->

            <div class="status-panel">

                <p id="statusText">
                    Player X starts
                </p>

            </div>





            <!-- Reset -->

            <button id="resetBtn">

                Reset Scores

            </button>


        </section>


    </main>


</div>



<script src="script.js"></script>

</body>
</html>
