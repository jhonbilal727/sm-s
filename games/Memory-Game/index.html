<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory | Modern Edition</title>

    <link rel="icon" type="image/png" href="assets/memory.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Start Menu -->
    <section class="start-screen" id="startScreen">

        <div class="start-container">

            <h1>Memory</h1>
            <p>Modern Edition</p>

            <button id="playBtn">
                Play Game
            </button>

            <button id="resetScoreBtn">
                Reset Score
            </button>

        </div>

    </section>


    <!-- Main Game -->
    <main class="game-container" id="gameContainer">

        <!-- Game Header -->
        <header class="game-header">

            <h1>Memory</h1>

            <p>
                Match the cards and beat your best score
            </p>

        </header>


        <!-- Game Area -->
        <section class="game-area">


            <!-- Card Board -->
            <div class="card-board" id="cardBoard">

                <!-- Cards will be generated by JavaScript -->

            </div>


            <!-- Score Panel -->
            <aside class="score-panel">

                <div class="score-box">
                    <span>Moves</span>
                    <strong id="moves">
                        0
                    </strong>
                </div>


                <div class="score-box">
                    <span>Best Score</span>
                    <strong id="bestScore">
                        0
                    </strong>
                </div>


                <div class="score-box">
                    <span>Level</span>
                    <strong id="level">
                        1
                    </strong>
                </div>


                <div class="score-box">
                    <span>Status</span>
                    <strong id="status">
                        Ready
                    </strong>
                </div>


                <button id="pauseBtn">
                    Pause
                </button>

            </aside>

        </section>

                <!-- Win Screen -->
        <section class="win-screen" id="winScreen">

            <div class="win-box">

                <h2>
                    You Won!
                </h2>

                <p>
                    Great memory skills!
                </p>

                <button id="restartBtn">
                    Restart
                </button>

            </div>

        </section>


    </main>


    <script src="script.js"></script>

</body>
</html>
