<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Royal Elegance | Erman Collection</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">ERMAN</a>

    <nav class="navbar">

        <a href="index.html">Home</a>
        <a href="collection.html">Collection</a>
        <a href="index.html#new">New</a>

    </nav>

    <div class="nav-icons">

        <i class="fa-solid fa-magnifying-glass"></i>

        <i class="fa-regular fa-heart"></i>

        <i class="fa-solid fa-bag-shopping"></i>

    </div>

</header>

<!-- PRODUCT -->

<section class="product-page">

    <div class="product-image">

        <img src="assets/images/dress-1.jpeg" alt="Royal Elegance">

    </div>

    <div class="product-details">

        <span class="category">Evening Collection</span>

        <h1>Royal Elegance</h1>

        <h2>₹24,999</h2>

        <p>

            A luxurious evening dress crafted from premium silk,
            designed for timeless elegance and unforgettable occasions.

        </p>

        <h4>Select Size</h4>

        <div class="sizes">

            <button>S</button>
            <button>M</button>
            <button>L</button>
            <button>XL</button>

        </div>

        <h4>Quantity</h4>

        <input type="number" value="1" min="1">

        <div class="product-buttons">

            <a href="cart.html" class="buy-btn">

                Add To Cart

            </a>

            <button class="wish-btn">

                <i class="fa-regular fa-heart"></i>

            </button>

        </div>

    </div>

</section>

<script src="js/script.js"></script>

</body>

</html>
