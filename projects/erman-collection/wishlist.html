<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | Erman Collection</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/wishlist.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<body>

<header class="header">

    <a href="index.html" class="logo">ERMAN</a>

    <nav class="navbar">

        <a href="index.html">Home</a>
        <a href="collection.html">Collection</a>
        <a href="index.html#new">New</a>

    </nav>

    <div class="nav-icons">

        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-regular fa-heart"></i>
        <i class="fa-solid fa-bag-shopping"></i>

    </div>

</header>

<section class="wishlist-page">

    <h1>My Wishlist</h1>

    <div class="wishlist-grid">

        <div class="wishlist-card">

            <img src="assets/images/dress-1.jpeg" alt="Royal Elegance">

            <h3>Royal Elegance</h3>

            <p>₹24,999</p>

            <div class="wishlist-buttons">

                <a href="product.html" class="view-btn">View</a>

                <a href="cart.html" class="cart-btn">
                    Add to Cart
                </a>

            </div>

        </div>

        <div class="wishlist-card">

            <img src="assets/images/dress-2.jpeg" alt="Golden Aura">

            <h3>Golden Aura</h3>

            <p>₹29,499</p>

            <div class="wishlist-buttons">

                <a href="product.html" class="view-btn">View</a>

                <a href="cart.html" class="cart-btn">
                    Add to Cart
                </a>

            </div>

        </div>

        <div class="wishlist-card">

            <img src="assets/images/dress-3.jpeg" alt="Midnight Grace">

            <h3>Midnight Grace</h3>

            <p>₹32,999</p>

            <div class="wishlist-buttons">

                <a href="product.html" class="view-btn">View</a>

                <a href="cart.html" class="cart-btn">
                    Add to Cart
                </a>

            </div>

        </div>

    </div>

</section>

<script src="js/script.js"></script>
