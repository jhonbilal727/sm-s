<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Erman Collection</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">ERMAN</a>

    <nav class="navbar">

        <a href="index.html">Home</a>
        <a href="collection.html">Collection</a>
        <a href="index.html#new">New</a>

    </nav>

    <div class="nav-icons">

        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-regular fa-heart"></i>
        <i class="fa-solid fa-bag-shopping"></i>

    </div>

</header>

<section class="cart-page">

    <h1>Shopping Cart</h1>

    <div class="cart-container">

        <div class="cart-items">

            <div class="cart-item">

                <img src="assets/images/dress-1.jpeg" alt="Dress">

                <div class="cart-info">

                    <h3>Royal Elegance</h3>

                    <p>Evening Collection</p>

                    <span>₹24,999</span>

                </div>

                <input type="number" value="1" min="1">

                <button class="remove-btn">
                    <i class="fa-solid fa-trash"></i>
                </button>

            </div>

        </div>

        <div class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-row">

                <span>Subtotal</span>

                <span>₹24,999</span>

            </div>

            <div class="summary-row">

                <span>Shipping</span>

                <span>Free</span>

            </div>

            <div class="summary-row total">

                <span>Total</span>

                <span>₹24,999</span>

            </div>

            <a href="#" class="checkout-btn">
                Proceed to Checkout
            </a>

        </div>

    </div>

</section>

<script src="js/script.js"></script>

</body>

</html>
